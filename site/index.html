<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actimed — лекарства и товары для здоровья</title>
  <meta name="description" content="Actimed: лекарства, витамины и товары для здоровья в Ташкенте с доставкой за 2 часа.">
  <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=JetBrains+Mono:wght@500&family=Jost:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-home">

  <!-- Шапка и меню (js/menu.js) -->
  <div data-site-header data-theme="dark"></div>

  <main>
    <h1 class="visually-hidden">Actimed — лекарства и товары для здоровья</h1>

    <!-- Лента товаров (js/ribbon.js) -->
    <section class="ribbon" data-ribbon aria-label="Товары">
      <canvas class="ribbon__canvas" data-ribbon-canvas aria-hidden="true"></canvas>
      <div class="ribbon__hud" aria-hidden="true">
        <p><span data-ribbon-group>Все товары</span> · <span data-ribbon-counter>01 / 16</span></p>
        <p class="ribbon__hint">Колесо, стрелки или перетаскивание</p>
      </div>
      <!-- Ссылки на товары: для клавиатуры и экранного диктора, без WebGL — видимая лента -->
      <ul class="ribbon__links" data-ribbon-links aria-label="Товары"></ul>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/lead.js"></script>
  <script type="module" src="js/ribbon.js"></script>
</body>
</html>

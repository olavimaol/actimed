<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  Шаблон для картинок сайта. Посетители его не открывают —
  его фотографирует tools/render-images.mjs.
  ?card=<id товара>    — карточка ленты 1600×900: 40% описание на «стекле», белая полоса, 60% картинка
  ?cutout=<id товара>  — упаковка на прозрачном фоне (страница товара)
  ?octagon             — картинка для восьмиугольника в футере 960×960
  ?figure              — объёмный знак над восьмиугольником 900×900 (прозрачный фон)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&family=Jost:wght@500;600&family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font-family: Manrope, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ================= Карточка ленты ================= */
  .card {
    --c: #2FA36B;
    position: relative; width: 1600px; height: 900px; overflow: hidden; background: transparent;
  }
  /* левая часть: один полупрозрачный блок с описанием (прозрачность видна в 3D-ленте) */
  .card__left {
    position: absolute; left: 0; top: 0; width: 640px; height: 900px; overflow: hidden;
    padding: 76px 66px 64px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .86) 0%, rgba(255, 255, 255, .8) 100%);
    color: #2F3437;
  }
  .caps {
    display: flex; align-items: center; gap: 18px;
    font-family: Inter, sans-serif; font-weight: 500; font-size: 21px; letter-spacing: .2em; text-transform: uppercase; color: #6A7377;
  }
  .caps::before {
    content: ""; width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 2px solid #9AA2A6; background: radial-gradient(circle at 35% 30%, #fff, #E3E7E9);
  }
  .heading { margin-top: 74px; color: #33383B; }
  .heading__a, .heading__b { display: block; white-space: nowrap; line-height: 1.02; width: max-content; }
  .heading__a { font-family: "Inter Tight", Inter, sans-serif; font-weight: 500; letter-spacing: -.035em; }
  .heading__b { font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; }
  .sub { margin-top: 44px; font-family: Inter, sans-serif; font-size: 31px; line-height: 1.42; color: #5C656A; }
  .bottom { position: absolute; left: 66px; right: 66px; bottom: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  /* стрелка «открыть» справа от цены — круглая стеклянная кнопка в стиле .project-open
     (тонкая обводка, едва заметная заливка, размытие фона); на светлом стекле — тёмная */
  .go {
    flex: none; width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center;
    border: 2.5px solid rgba(47, 52, 55, .3);
    background: rgba(47, 52, 55, .05);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .go svg { width: 62px; height: 62px; fill: none; stroke: #2F3437; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .price { font-family: Inter, sans-serif; font-weight: 600; font-size: 31px; color: #2F3437; white-space: nowrap; }
  .price small { display: block; font-weight: 500; font-size: 19px; color: #A0672A; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }

  /* белая полоса */
  .card__strip { position: absolute; left: 640px; top: 0; width: 2px; height: 900px; background: #fff; }

  /* правая часть: товар */
  .card__right {
    position: absolute; left: 642px; right: 0; top: 0; bottom: 0; overflow: hidden;
    background:
      radial-gradient(70% 70% at 55% 40%, color-mix(in srgb, var(--c) 45%, white) 0%, transparent 65%),
      radial-gradient(120% 90% at 10% 110%, color-mix(in srgb, var(--c) 45%, #04191C) 0%, transparent 70%),
      linear-gradient(155deg, color-mix(in srgb, var(--c) 88%, white) 0%, var(--c) 48%, color-mix(in srgb, var(--c) 65%, #04191C) 100%);
  }
  .card__right::after {
    content: ""; position: absolute; inset: 0; opacity: .14; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .card__floor {
    position: absolute; left: 12%; right: 12%; bottom: 96px; height: 120px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(3, 30, 33, .45), transparent); filter: blur(14px);
  }
  .card__stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .card__stage .pack { position: relative; }
  .card__brand {
    position: absolute; right: 50px; top: 44px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: Jost, sans-serif; font-weight: 500; font-size: 17px; letter-spacing: .2em; color: rgba(255, 255, 255, .92);
  }
  .card__brand img { width: 52px; height: 48px; filter: brightness(0) invert(1); opacity: .92; }

  /* ================= Упаковки ================= */
  .pack { position: absolute; --c: #2FA36B; color: #13282C; }
  .box {
    width: 520px; height: 340px; border-radius: 22px; padding: 44px 40px 36px; overflow: hidden;
    background: linear-gradient(160deg, #FFFFFF 0%, #EEF4F3 70%, #E2EBEA 100%);
    box-shadow: 0 60px 90px -30px rgba(3, 30, 33, .55), inset 0 -14px 0 rgba(0, 0, 0, .05), inset 0 2px 0 rgba(255, 255, 255, .9);
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .box .band { position: absolute; left: 0; right: 0; top: 0; height: 34%; background: var(--c); }
  .box .band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 14px; background: color-mix(in srgb, var(--c) 35%, white); }
  .box .cross {
    position: absolute; right: 30px; top: 28px; width: 44px; height: 44px;
    background: linear-gradient(#fff, #fff) center / 44px 14px no-repeat, linear-gradient(#fff, #fff) center / 14px 44px no-repeat;
  }
  .brand { font-family: Jost, sans-serif; font-weight: 600; font-size: 21px; letter-spacing: .16em; color: var(--c); text-transform: uppercase; }
  .name { font-weight: 800; font-size: 48px; line-height: 1.05; margin-top: 6px; }
  .dose { font-size: 24px; color: #5A6E71; margin-top: 8px; font-weight: 600; }
  .rx { position: absolute; left: 40px; top: 38px; background: #fff; color: #C7792A; font-weight: 800; font-size: 20px; padding: 6px 16px; border-radius: 99px; }

  .bottle {
    width: 300px; height: 470px; border-radius: 70px 70px 44px 44px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--c) 70%, black) 0%, var(--c) 22%,
      color-mix(in srgb, var(--c) 55%, white) 44%, var(--c) 66%, color-mix(in srgb, var(--c) 72%, black) 100%);
    box-shadow: 0 70px 90px -30px rgba(3, 30, 33, .6);
  }
  .bottle .cap {
    position: absolute; left: 50%; top: -66px; transform: translateX(-50%); width: 64%; height: 84px; border-radius: 18px 18px 8px 8px;
    background: repeating-linear-gradient(90deg, #F5F8F8 0 12px, #D5E0DF 12px 16px);
    box-shadow: inset 0 -10px 0 rgba(0, 0, 0, .08);
  }
  .bottle .label {
    position: absolute; left: 24px; right: 24px; top: 30%; bottom: 16%; border-radius: 20px; background: #fff; padding: 26px 22px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .bottle .name { font-size: 36px; }
  .bottle .dose { font-size: 20px; }
  .bottle .brand { font-size: 16px; }

  .tube {
    width: 270px; height: 520px; border-radius: 30px 30px 110px 110px / 30px 30px 60px 60px;
    background: linear-gradient(90deg, #DDE7E6 0%, #FFFFFF 30%, #F2F6F6 60%, #CFDCDB 100%);
    box-shadow: 0 70px 90px -30px rgba(3, 30, 33, .55);
  }
  .tube::before {
    content: ""; position: absolute; left: -8px; right: -8px; top: -22px; height: 40px; border-radius: 6px;
    background: repeating-linear-gradient(0deg, #E9F0EF 0 6px, #CBD8D6 6px 8px);
  }
  .tube .cap { position: absolute; left: 50%; bottom: -70px; transform: translateX(-50%); width: 120px; height: 80px; border-radius: 10px 10px 22px 22px; background: var(--c); box-shadow: inset 0 -10px 0 rgba(0, 0, 0, .12); }
  .tube .stripe { position: absolute; left: 0; right: 0; top: 22%; height: 70px; background: var(--c); }
  .tube .label { position: absolute; left: 22px; right: 18px; top: 40%; display: flex; flex-direction: column; }
  .tube .name { font-size: 30px; }
  .tube .dose { font-size: 19px; }
  .tube .brand { font-size: 15px; }

  .device {
    width: 470px; height: 380px; border-radius: 60px; padding: 40px;
    background: linear-gradient(160deg, #FFFFFF, #E4ECEB);
    box-shadow: 0 60px 90px -30px rgba(3, 30, 33, .55), inset 0 -12px 0 rgba(0, 0, 0, .05);
  }
  .device .screen { height: 170px; border-radius: 26px; background: linear-gradient(160deg, #183D44, #0B2E33); color: #9EF0CF; font-weight: 800; font-size: 76px; display: flex; align-items: center; justify-content: flex-end; padding: 0 36px; letter-spacing: .02em; }
  .device .screen small { font-size: 26px; margin-left: 12px; color: #6FB7A6; }
  .device .btn { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); width: 120px; height: 120px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .15); }
  .thermo {
    width: 120px; height: 600px; border-radius: 60px 60px 30px 30px;
    background: linear-gradient(90deg, #DCE6E5, #FFFFFF 40%, #E8EFEE 70%, #CAD7D5);
    box-shadow: 0 60px 90px -30px rgba(3, 30, 33, .55);
  }
  .thermo .screen { position: absolute; left: 18px; right: 18px; top: 90px; height: 70px; border-radius: 12px; background: #0B2E33; color: #9EF0CF; font-weight: 800; font-size: 32px; display: grid; place-items: center; }
  .thermo .tip { position: absolute; left: 50%; bottom: -70px; transform: translateX(-50%); width: 34px; height: 90px; border-radius: 0 0 17px 17px; background: linear-gradient(90deg, #B9C6C4, #F4F7F7, #AFBDBB); }

  /* ================= Упаковка отдельно ================= */
  .cutout { display: inline-block; padding: 110px 90px 150px; }
  .cutout .pack { position: relative; }

  /* ================= Восьмиугольник ================= */
  .octa {
    position: relative; width: 960px; height: 960px; overflow: hidden;
    background:
      radial-gradient(60% 50% at 30% 22%, #E9F6F0 0%, transparent 70%),
      radial-gradient(70% 60% at 80% 85%, #2E9C8C 0%, transparent 70%),
      linear-gradient(165deg, #CDEDE3 0%, #7FC8B4 48%, #1E7F78 100%);
  }
  .octa::after {
    content: ""; position: absolute; inset: 0; opacity: .22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .octa svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ================= Объёмный знак ================= */
  .figure { width: 900px; height: 900px; }
  .figure canvas { width: 900px; height: 900px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../js/data.js"></script>
<script>
  var D = window.ACTIMED;

  // Надписи на упаковках
  var PACK = {
    'ibuprofen': { name: 'Ибупрофен', dose: '200 мг · 20 таблеток' },
    'paracetamol': { name: 'Парацетамол', dose: '500 мг · 10 таблеток' },
    'vitamin-d3': { name: 'Витамин D3', dose: '2000 МЕ · 60 капсул' },
    'omega-3': { name: 'Омега-3', dose: '1000 мг · 90 капсул' },
    'loratadine': { name: 'Лоратадин', dose: '10 мг · 10 таблеток' },
    'ambroxol': { name: 'Амброксол', dose: 'сироп · 100 мл' },
    'magnesium-b6': { name: 'Магний B6', dose: '50 таблеток' },
    'chlorhexidine': { name: 'Хлоргексидин', dose: 'спрей 0,05% · 100 мл' },
    'atorvastatin': { name: 'Аторвастатин', dose: '20 мг · 30 таблеток' },
    'aspirin-cardio': { name: 'Ацетилсалициловая кислота', dose: '75 мг · 30 таблеток', fs: 38 },
    'amoxicillin': { name: 'Амоксициллин', dose: '500 мг · 16 капсул' },
    'cetirizine': { name: 'Цетиризин', dose: 'капли · 20 мл' },
    'diaper-cream': { name: 'Крем под подгузник', dose: '75 мл' },
    'hand-cream': { name: 'Крем для рук', dose: 'увлажняющий · 50 мл' }
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function byId(id) { return D.products.filter(function (p) { return p.id === id; })[0]; }
  function priceText(n) { return n.toLocaleString('ru-RU').replace(/ |,/g, ' ') + ' сум'; }

  function packHtml(p, extraStyle) {
    var t = PACK[p.id] || {};
    var style = '--c:' + p.color + ';' + (extraStyle || '');
    var label = '<span class="brand">Actimed</span><span class="name"' + (t.fs ? ' style="font-size:' + t.fs + 'px"' : '') + '>' + esc(t.name || p.title) + '</span><span class="dose">' + esc(t.dose || '') + '</span>';
    if (p.type === 'box') return '<div class="pack box" style="' + style + '"><span class="band"></span><span class="cross"></span>' + (p.rx ? '<span class="rx">По рецепту</span>' : '') + label + '</div>';
    if (p.type === 'bottle') return '<div class="pack bottle" style="' + style + '"><span class="cap"></span><span class="label">' + label + '</span></div>';
    if (p.type === 'tube') return '<div class="pack tube" style="' + style + '"><span class="stripe"></span><span class="label">' + label + '</span><span class="cap"></span></div>';
    if (p.type === 'device') return '<div class="pack device" style="' + style + '"><div class="screen">120/80<small>мм рт. ст.</small></div><span class="btn"></span></div>';
    if (p.type === 'thermo') return '<div class="pack thermo" style="' + style + '"><div class="screen">36,6°</div><span class="tip"></span></div>';
    return '';
  }

  var SCALE = { box: 1.18, bottle: 1.22, tube: 1.18, device: 1.1, thermo: 1.05 };

  function card(id) {
    var p = byId(id);
    var i = D.products.indexOf(p);
    var cat = D.categories[p.cat];
    var rot = [-7, 6, -4, 8, -9, 5][i % 6];
    return '<div class="card" id="shot" style="--c:' + p.color + '">' +
      '<div class="card__left">' +
        '<p class="caps">' + esc(cat.short) + '</p>' +
        '<h1 class="heading"><span class="heading__a" data-fit>' + esc(p.title) + '</span><span class="heading__b" data-fit>' + esc(p.accent) + '</span></h1>' +
        '<p class="sub">' + esc(p.short[0]) + '<br>' + esc(p.short[1]) + '</p>' +
        '<div class="bottom"><span class="price">' + (p.rx ? '<small>Рецепт</small>' : '') + priceText(p.price) + '</span>' +
          '<span class="go"><svg viewBox="0 0 40 40"><path d="M13 27 27 13M15.5 13H27v11.5"/></svg></span></div>' +
      '</div>' +
      '<span class="card__strip"></span>' +
      '<div class="card__right"><span class="card__floor"></span>' +
        '<div class="card__stage">' + packHtml(p, 'transform:rotate(' + rot + 'deg) scale(' + SCALE[p.type] + ')') + '</div>' +
        '<span class="card__brand"><img src="../img/logo-mark.svg" alt="">ACTIMED</span>' +
      '</div>' +
    '</div>';
  }

  // Обе строки заголовка — одного кегля, чтобы влезли в стекло
  function fitHeading() {
    var lines = document.querySelectorAll('[data-fit]');
    if (!lines.length) return;
    var max = 500, size = 104;
    lines.forEach(function (l) { l.style.fontSize = size + 'px'; });
    var widest = 0;
    lines.forEach(function (l) { widest = Math.max(widest, l.getBoundingClientRect().width); });
    if (widest > max) size = Math.floor(size * max / widest);
    lines.forEach(function (l) { l.style.fontSize = size + 'px'; });
  }

  function cutout(id) {
    return '<div class="cutout" id="shot">' + packHtml(byId(id)) + '</div>';
  }

  function octagon() {
    // вместо листьев — «+», как на полу ленты: разного размера, часть размыта
    var grid = '';
    for (var gx = 60; gx < 960; gx += 120) {
      for (var gy = 60; gy < 960; gy += 120) {
        grid += '<path d="M' + (gx - 9) + ' ' + gy + 'h18M' + gx + ' ' + (gy - 9) + 'v18"/>';
      }
    }
    var plus = '';
    [[205, 615, 170, 20, '#0B4A4C', .4, 0], [360, 770, 92, 13, '#0B4A4C', .32, 0], [705, 265, 128, 16, '#0B4A4C', .28, 0],
     [775, 560, 76, 11, '#FFFFFF', .62, 0], [485, 845, 62, 10, '#0B4A4C', .36, 0], [150, 300, 84, 12, '#FFFFFF', .55, 0],
     [610, 420, 250, 30, '#FFFFFF', .2, 8], [855, 770, 120, 16, '#0B4A4C', .22, 4], [330, 150, 54, 9, '#0B4A4C', .3, 0],
     [560, 660, 40, 7, '#FFFFFF', .7, 0]].forEach(function (q) {
      var h = q[2] / 2;
      plus += '<path d="M' + (q[0] - h) + ' ' + q[1] + 'H' + (q[0] + h) + 'M' + q[0] + ' ' + (q[1] - h) + 'V' + (q[1] + h) + '"' +
        ' stroke="' + q[4] + '" stroke-width="' + q[3] + '" opacity="' + q[5] + '"' + (q[6] ? ' filter="url(#blur' + q[6] + ')"' : '') + '/>';
    });
    var dots = '';
    [[620, 150, 70], [860, 330, 34], [120, 520, 28]].forEach(function (d) {
      dots += '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="' + d[2] + '" fill="#FFFFFF" opacity=".2"/>';
    });
    return '<div class="octa" id="shot"><svg viewBox="0 0 960 960">' +
      '<defs><filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>' +
      '<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter></defs>' +
      dots + '<g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".32">' + grid + '</g>' +
      '<g fill="none" stroke-linecap="round">' + plus + '</g></svg></div>';
  }

  // Объёмный знак — неподвижная картинка на случай без WebGL (js/logo3d.js)
  function figure() {
    var html = '<div class="figure" id="shot"><canvas></canvas></div>';
    import('../js/logo3d.js').then(function (m) {
      var f = m.createFigure(document.querySelector('.figure canvas'));
      f.resize(900, window.devicePixelRatio || 1);
      f.render(-0.32, 0.12, 0.015, 0);
      window.figureReady = true;
    });
    return html;
  }

  var q = new URLSearchParams(location.search);
  var root = document.getElementById('root');
  if (q.has('card')) root.innerHTML = card(q.get('card'));
  else if (q.has('cutout')) root.innerHTML = cutout(q.get('cutout'));
  else if (q.has('octagon')) root.innerHTML = octagon();
  else if (q.has('figure')) root.innerHTML = figure();
  document.fonts.ready.then(fitHeading);
  window.fitHeading = fitHeading;
</script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StringTune : Tutorial : StringTune</title>
  <script src="https://unpkg.com/@fiddle-digital/string-tune@1.2.1/dist/index.js"></script>
  <style>
@property --progress {
  syntax: '<number>';
  inherits: true;
  initial-value: 0;
}

@property --spotlight-angle {
  syntax: '<number>';
  inherits: true;
  initial-value: 0;
}

@property --spotlight-distance {
  syntax: '<number>';
  inherits: true;
  initial-value: 0;
}

:root {
  --vh: 1vh;
  --vw: 1vw;
  --c-white: #ffffff;
  --c-black: #000000;
  --c-black-rgb: 0, 0, 0;
  --c-grey-dark: #333333;
  --c-grey-dark-rgba: 51, 51, 51;
  --c-grey: #999999;
  --c-red: #FF5A37;

  --easing-function: cubic-bezier(0.86, 0, 0.31, 1);
  --easing-function-2: cubic-bezier(0.35, 0.35, 0, 1);
  --easing-timing: 1.5s;

  --g-gap: 0.4rem;
  --g-margin: calc(var(--g-gap) * 2);

  --mm: 0.64rem;
  --m: 0.8rem;
  --p: 1rem;
  --h6: 1.25rem;
  --h5: 1.563rem;
  --h4: 1.953rem;
  --h3: 2.441rem;
  --h2: 3.052rem;
  --h1: 3.815rem;
  --h0: 5.065rem;
  --large: max(6.331rem, 18vw);
  
}
@media (min-width: 1024px) {
  :root {
    --g-margin: calc(var(--g-gap) * 4);
  }
}

html,
body,
* {
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  line-height: 1.25;
  font-family: Arial, Helvetica, sans-serif;
  background-color: #808080;
  color: black;
}
.-w {
  margin-left: var(--g-margin);
  margin-right: var(--g-margin);
}
@media (min-width: 1024px) {
  html {
    font-size: 20px;
  }
}
body {
  position: relative;
  min-height: 100lvh;
}
.note {
  color: var(--c-white);
}
svg {
  display: block;
}
img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
button {
  border: none;
  margin: 0;
  padding: 0;
  position: relative;
  background-color: transparent;
  cursor: pointer;
  display: block;
  touch-action: manipulation;
  color: var(--c-white);
}

h1,
h2,
h3,
h3,
h4,
h5,
h6 {
  font-family: Arial, Helvetica, sans-serif;
  font-weight: normal;
}
.-lrg {
  font-size: var(--large);
}
.-h0 {
  font-size: var(--h0);
}
h1, .-h1 {
  font-size: var(--h1);
}
h2, .-h2 {
  font-size: var(--h2);
}
h3, .-h3 {
  font-size: var(--h3);
}
h4, .-h4 {
  font-size: var(--h4);
}
h5, .-h5 {
  font-size: var(--h5);
}
h6, .-h6 {
  font-size: var(--h6);
}
.-p {
  font-size: var(--p);
}
.-m {
  font-size: var(--m);
}
.-mm {
  font-size: var(--mm);
}
@media (max-width: 1600px) {
  .-mid-lrg {
    font-size: var(--large);
  }
  .-mid-h0 {
    font-size: var(--h0);
  }
  .-mid-h1 {
    font-size: var(--h1);
  }
  .-mid-h2 {
    font-size: var(--h2);
  }
  .-mid-h3 {
    font-size: var(--h3);
  }
  .-mid-h4 {
    font-size: var(--h4);
  }
  .-mid-h5 {
    font-size: var(--h5);
  }
  .-mid-h6 {
    font-size: var(--h6);
  }
  .-mid-p {
    font-size: var(--p);
  }
  .-mid-m {
    font-size: var(--m);
  }
  .-mid-mm {
    font-size: var(--mm);
  }
}

@media (max-width: 1024px) {
  .-m-lrg {
    font-size: var(--large);
  }
  .-m-h0 {
    font-size: var(--h0);
  }
  .-m-h1 {
    font-size: var(--h1);
  }
  .-m-h2 {
    font-size: var(--h2);
  }
  .-m-h3 {
    font-size: var(--h3);
  }
  .-m-h4 {
    font-size: var(--h4);
  }
  .-m-h5 {
    font-size: var(--h5);
  }
  .-m-h6 {
    font-size: var(--h6);
  }
  .-m-p {
    font-size: var(--p);
  }
  .-m-m {
    font-size: var(--m);
  }
  .-m-mm {
    font-size: var(--mm);
  }
}

.-up {
  text-transform: uppercase;
}
.-tac {
  text-align: center;
}

.-splitted {
  display: flex;
  flex-wrap: wrap;
}
.-s-line {
  display: flex;
  width: 100%;
  will-change: contents;
}
.-s-word {
  display: inline-flex;
  will-change: contents;
}
.-s-char {
  display: inline-flex;
  will-change: contents;
}

.-w {
  height: calc( var(--vh,1vh) * 1200 );
  contain: paint;
}
.-w div {
  display: grid;
  margin-left: calc( 50% + var(--g-gap));
  position: sticky;
  top: calc( var(--vh,1vh) * 50 );
  transform-origin: calc( var(--g-gap) * -0.5) 50%;
  rotate: calc( 4 * -360deg * var(--progress) );
}
.-w div > span {
  grid-area: 1/1;
  display: block;
  text-transform: capitalize;
  transform-origin: 0% 50%;
  transform: rotate(calc(var(--order) * 360deg / var(--total))) translate( calc( var(--total) * 0.2em), 0);
  translate: calc( var(--g-gap) * -0.5 ) 0;
}
.-w div > span:first-child {
  color: var(--c-red);
}

.-s-char {
  rotate: calc( pow(var(--char-index),1.75) * var(--lerp) * 0.1deg);
  translate: calc( pow(var(--char-index),1.75) * abs(var(--lerp)) * -0.00125em ) calc( pow(var(--char-index),1.75) * var(--lerp) * 0.0025em );
}

@media (min-width: 1024px) {}
</style>
<script src="/string-tune/replica-forms.js" defer></script></head>

<body>
  <div class="-w" string="progress|lerp[]" string-enter-vp="top" string-exit-vp="bottom">
  <div class="-h4" style="--total: 12" >
    <span string="split" string-split="char" style="--order: 0;">start</span>
    <span string="split" string-split="char" style="--order: 1;">small</span>
    <span string="split" string-split="char" style="--order: 2;">move</span>
    <span string="split" string-split="char" style="--order: 3;">fast</span>
    <span string="split" string-split="char" style="--order: 4;">stay</span>
    <span string="split" string-split="char" style="--order: 5;">sharp</span>
    <span string="split" string-split="char" style="--order: 6;">adapt</span>
    <span string="split" string-split="char" style="--order: 7;">quickly</span>
    <span string="split" string-split="char" style="--order: 8;">finish</span>
    <span string="split" string-split="char" style="--order: 9;">strong</span>
    <span string="split" string-split="char" style="--order: 10;">stay</span>
    <span string="split" string-split="char" style="--order: 11;">focused</span>
  </div>
</div>
  <script>
    const stringTune = StringTune.StringTune.getInstance();
    window.StringTuneContext = stringTune;
      // No additional StringTune modules configured for this tutorial.

    stringTune.start(0);
  </script>
  

</body>
